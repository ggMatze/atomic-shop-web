<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Atomic Shop JSON Stripper</title>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', 'Fira Mono', 'Consolas', 'monospace', sans-serif; margin: 2em; }
    h2, h3 { color: #569cd6; font-weight: 500; }
    textarea { background: #252526; color: #d4d4d4; border: 1px solid #333; height: 200px; }
    textarea:focus { border-color: #007acc; }
    button { background: #0e639c; box-shadow: 0 2px 8px #0004; }
    button:hover { background: #007acc; }
    pre { background: #252526; color: #d4d4d4; border: 1px solid #333; min-height: 200px; }
  </style>
</head>
<body>
  <h2>JSON Stripper für Atomic Shop</h2>
  <p>Füge hier deinen <b>storepagedata.json</b> Inhalt ein:</p>
  <textarea id="input" placeholder="JSON hier einfügen..."></textarea>
  <br>
  <button onclick="stripJSON()">Strip &amp; Anzeigen</button>
  <button onclick="downloadJSON()">Speichern als Datei</button>
  <br>
  <button onclick="copyAll()" style="margin-top:1em;">Alles kopieren</button>
  <h3>Ergebnis:</h3>
  <pre id="output" class="language-json"></pre>

  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
  <script>
    // Haupt-Keys, die du wirklich brauchst
    const allowedKeys = [
      "itemID", "itemName", "itemNameShort", "itemDesc", "EDID", "edid",
      "primaryImage", "carouselImages", "dynamicBundleItems",
      "lowPrice", "lowestPurchasablePrice", "highPrice",
      "isNew", "isZeus", "isClown", "tileSize", "tabid"
    ];

  // Nur diese Felder in Preis-Objekten übernehmen
  // Added "purchaseLimit" so purchase limit information is preserved when stripping
  const allowedPriceKeys = ["amount", "originalAmount", "isLto", "ltoTimer", "purchaseLimit"];

    // Nur diese Felder in primaryImage und carouselImages übernehmen
    const allowedImageKeys = ["imageName", "directory"];

    // Preserve bundle names and ID fields so bundle-image matching still works after stripping
    const allowedBundleItemKeys = ["szItemName", "itemName", "name", "EDID", "edid", "entmName", "entm", "id", "itemID"];

  // Welche Felder auf Page-Ebene erhalten bleiben sollen
  const allowedPageKeys = ["name", "isZeus", "image", "items"];

    function stripPrice(obj) {
      if (!obj || typeof obj !== "object") return undefined;
      const result = {};
      Object.keys(obj).forEach(key => {
        if (allowedPriceKeys.includes(key)) result[key] = obj[key];
      });
      return result;
    }

    function stripImage(obj) {
      if (!obj || typeof obj !== "object") return undefined;
      const result = {};
      Object.keys(obj).forEach(key => {
        if (allowedImageKeys.includes(key)) result[key] = obj[key];
      });
      return result;
    }

    function stripBundleItem(obj) {
      if (!obj || typeof obj !== "object") return undefined;
      const result = {};
      Object.keys(obj).forEach(key => {
        if (allowedBundleItemKeys.includes(key)) result[key] = obj[key];
      });
      return result;
    }

    function stripItem(item) {
      if (!item || typeof item !== "object") return {};
      const result = {};
      Object.keys(item).forEach(key => {
        if (!allowedKeys.includes(key)) return;
        if (["lowPrice", "lowestPurchasablePrice", "highPrice"].includes(key)) {
          result[key] = stripPrice(item[key]);
        } else if (key === "primaryImage") {
          result[key] = stripImage(item[key]);
        } else if (key === "carouselImages" && Array.isArray(item[key])) {
          result[key] = item[key].map(stripImage);
        } else if (key === "dynamicBundleItems" && Array.isArray(item[key])) {
          result[key] = item[key].map(stripBundleItem);
        } else {
          result[key] = item[key];
        }
      });
      // Remove any private/metadata keys that start with '_' if present
      // (some source data contains _detectedSuffixInfo and similar fields)
      Object.keys(result).forEach(k => {
        if (k && k.charAt(0) === '_') delete result[k];
      });
      // Also defensively remove a commonly seen metadata field if it slipped through
      if (result._detectedSuffixInfo) delete result._detectedSuffixInfo;
      return result;
    }

    function stripPage(page) {
      const p = {};
      if (page.hasOwnProperty('name')) p.name = page.name;
      if (page.hasOwnProperty('isZeus')) p.isZeus = page.isZeus;
      if (page.hasOwnProperty('image')) p.image = stripImage(page.image);
      if (Array.isArray(page.items)) p.items = page.items.map(stripItem);
      return p;
    }

    function getPagesFromData(data) {
      if (Array.isArray(data)) return data;
      if (!data || typeof data !== 'object') return [];
      if (data.StorePageData && typeof data.StorePageData === 'object') {
        if (Array.isArray(data.StorePageData.pages)) return data.StorePageData.pages;
        if (Array.isArray(data.StorePageData)) return data.StorePageData;
      }
      if (Array.isArray(data.pages)) return data.pages;
      if (Array.isArray(data.items)) return [data];
      return [];
    }

    function stripJSON() {
      let input = document.getElementById('input').value;
      try {
        let data = JSON.parse(input);
        let out = {};
        const pages = getPagesFromData(data);
        if (pages.length) {
          // Auto-generate tabid per page (respect explicit page.tabid if present).
          const usedTabIds = new Set();
          out.StorePageData = { pages: pages.map((page, idx) => {
            const stripped = stripPage(page);
            // helper: return a new object with tabid directly after name
            const buildPageObject = (base, id) => {
              const obj = {};
              if (base.hasOwnProperty('name')) obj.name = base.name;
              obj.tabid = id;
              if (base.hasOwnProperty('isZeus')) obj.isZeus = base.isZeus;
              if (base.hasOwnProperty('image')) obj.image = base.image;
              if (base.hasOwnProperty('items')) obj.items = base.items;
              return obj;
            };

            // If source includes explicit tabid, preserve it and mark as used
            if (page.hasOwnProperty('tabid') && page.tabid) {
              const explicit = String(page.tabid);
              usedTabIds.add(explicit);
              return buildPageObject(stripped, explicit);
            }

            // Derive from first line of name, trim after common separators and cap length
            const rawName = (page.name || '').replace(/\r\n/g, '\n').replace(/\\n/g, '\n');
            let titlePart = (rawName.split('\n')[0] || '').split(/\s[-—:\|]\s|\s[-—]\s|\s:\s|\|/)[0].trim();
            if (!titlePart) titlePart = `tab-${idx}`;
            if (titlePart.length > 40) titlePart = titlePart.slice(0, 40).trim();

            let baseSlug = String(titlePart).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            if (!baseSlug) baseSlug = `tab-${idx}`;
            let slug = baseSlug;
            let counter = 1;
            while (usedTabIds.has(slug)) { slug = `${baseSlug}-${counter++}`; }
            usedTabIds.add(slug);
            return buildPageObject(stripped, slug);
          }) };
        }
        const pretty = JSON.stringify(out, null, 2);
        document.getElementById('output').textContent = pretty;
        Prism.highlightElement(document.getElementById('output'));
      } catch (e) {
        document.getElementById('output').textContent = 'Fehler: ' + e.message;
      }
    }

    function downloadJSON() {
      const text = document.getElementById('output').textContent;
      const blob = new Blob([text], {type: "application/json"});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = "storepagedata-stripped.json";
      a.click();
    }

    function copyAll() {
      const output = document.getElementById('output');
      const text = output.textContent;
      navigator.clipboard.writeText(text)
        .then(() => {
          output.style.boxShadow = "0 0 0 2px #007acc";
          setTimeout(() => output.style.boxShadow = "", 700);
        });
    }
  </script>
</body>
</html>
