<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bundle ID Enricher</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e8f0;
      background: #0f172a;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #020617;
      color: #e2e8f0;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 24px 68px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    h2 {
      color: #f8fafc;
      margin-bottom: 10px;
    }
    p {
      line-height: 1.75;
      color: #cbd5e1;
    }
    label {
      display: block;
      margin: 20px 0 10px;
      font-weight: 700;
      color: #f8fafc;
    }
    input[type=file], select, button, input[type=text] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      outline: none;
    }
    input[type=file] {
      padding: 12px 10px;
    }
    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      margin-top: 16px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #1d4ed8;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    pre {
      max-height: 320px;
      overflow: auto;
      background: #020617;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 16px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .summary {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }
    .summary div {
      padding: 18px;
      border-radius: 14px;
      background: #0e1728;
      border: 1px solid #334155;
    }
    .summary div strong {
      display: block;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    #matches h2, #missingSection h2 {
      margin-top: 28px;
    }
    .missing-card {
      border: 1px solid #334155;
      background: #0f172a;
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
    }
    .missing-card p {
      margin: 0 0 10px;
      color: #cbd5e1;
    }
    .missing-row {
      display: grid;
      gap: 10px;
    }
    .result-button {
      width: auto;
      padding: 8px 12px;
      margin-right: 8px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #e2e8f0;
    }
    .result-button:hover {
      background: #334155;
    }
    .result-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }
    .result-item {
      padding: 12px;
      border-radius: 12px;
      background: #111827;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .result-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bundle ID Enricher</h1>
    <p>Load your `items-db.json`, then this tool will add `entmName` IDs to `dynamicBundleItems` entries that currently only have `szItemName`.</p>
    <label for="fileInput">Choose JSON file</label>
    <input id="fileInput" type="file" accept="application/json" />

    <label for="idField">Bundle entry ID property to populate</label>
    <select id="idField">
      <option value="entmName" selected>entmName</option>
      <option value="EDID">EDID</option>
      <option value="edid">edid</option>
    </select>

    <button id="processBtn" disabled>Process file</button>

    <div class="summary" id="summary"></div>
    <div id="matches"></div>

    <section id="missingSection" hidden>
      <h2>Resolve missing bundle entries</h2>
      <p>Search the loaded DB or enter an ID manually for any bundle items that could not be resolved automatically.</p>
      <div id="missingList"></div>
    </section>

    <pre id="output" hidden></pre>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const summaryEl = document.getElementById('summary');
    const matchesEl = document.getElementById('matches');
    const outputEl = document.getElementById('output');
    const missingSection = document.getElementById('missingSection');
    const missingList = document.getElementById('missingList');
    let jsonData = null;
    let currentIdField = 'entmName';
    let currentFileName = 'items-db.json';

    function normalize(value) {
      return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function createElement(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      Object.entries(attrs).forEach(([key, value]) => {
        if (key === 'class') el.className = value;
        else if (key === 'text') el.textContent = value;
        else if (key === 'html') el.innerHTML = value;
        else el.setAttribute(key, value);
      });
      children.forEach(child => {
        if (typeof child === 'string') el.appendChild(document.createTextNode(child));
        else if (child) el.appendChild(child);
      });
      return el;
    }

    function searchItems(query, items) {
      const normalized = normalize(query);
      if (!normalized) return [];
      return items
        .map(item => {
          const name = String(item.itemName || item.itemNameShort || item.szItemName || item.name || '').trim();
          const id = item.entmName || item.EDID || item.edid || '';
          return { item, name, id };
        })
        .filter(entry => normalize(entry.name).includes(normalized) || normalize(entry.id).includes(normalized))
        .slice(0, 20);
    }

    function updateDownloadLink(data, fileName) {
      // Clear old download section
      const oldContainer = summaryEl.querySelector('[data-download-container]');
      if (oldContainer) oldContainer.remove();
      
      const downloadButton = createElement('button', { type: 'button', text: '📥 Download updated JSON' });
      downloadButton.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName.replace(/\.json$/i, '.with-ids.json');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
      downloadButton.style.width = '100%';
      downloadButton.style.marginTop = '8px';
      downloadButton.style.marginRight = '8px';
      
      const copyButton = createElement('button', { type: 'button', text: '📋 Copy JSON to clipboard' });
      copyButton.addEventListener('click', () => {
        navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
          copyButton.textContent = '✓ Copied!';
          setTimeout(() => { copyButton.textContent = '📋 Copy JSON to clipboard'; }, 2000);
        }).catch(() => alert('Failed to copy to clipboard'));
      });
      copyButton.style.width = '100%';
      copyButton.style.marginTop = '8px';
      
      const buttonContainer = createElement('div', { 'data-download-container': 'true', style: 'display: grid; grid-template-columns: 1fr 1fr; gap: 10px;' }, [downloadButton, copyButton]);
      summaryEl.appendChild(buttonContainer);
      
      const instruction = createElement('p', { 
        html: '<strong>⚠️ Important:</strong> Download or copy the JSON, then replace your original <code>items-db.json</code> file with this updated version. Browser downloads cannot auto-overwrite files.',
        style: 'background: #1e293b; padding: 14px; border-radius: 12px; border: 1px solid #475569; margin-top: 12px;'
      });
      summaryEl.appendChild(instruction);
    }

    function renderMissingEntries(missingEntries, items) {
      missingList.innerHTML = '';
      if (!missingEntries.length) {
        missingSection.hidden = true;
        return;
      }
      missingSection.hidden = false;

      missingEntries.forEach((missing, index) => {
        const card = createElement('div', { class: 'missing-card' });
        const title = createElement('p', { html: `<strong>${index + 1}. ${missing.name}</strong>` });
        const row = createElement('div', { class: 'missing-row' });

        const queryInput = createElement('input', {
          type: 'text',
          value: missing.name,
          placeholder: 'Search loaded DB by item name or ID'
        });

        const manualInput = createElement('input', {
          type: 'text',
          value: missing.manual || '',
          placeholder: 'Optional manual ID (e.g. entmName, EDID)'
        });

        const setBtn = createElement('button', { type: 'button', text: 'Apply manual ID' });
        setBtn.className = 'result-button';
        setBtn.addEventListener('click', () => {
          const value = manualInput.value.trim();
          if (!value) return;
          missing.entry[currentIdField] = value;
          missing.fixed = true;
          updateDownloadLink(jsonData, currentFileName);
          renderMissingEntries(missingEntries, items);
        });

        const resultContainer = createElement('div', { class: 'result-list' });

        row.append(queryInput, manualInput, setBtn);
        card.append(title, row, resultContainer);
        missingList.appendChild(card);

        function updateResults() {
          const results = searchItems(queryInput.value, items);
          resultContainer.innerHTML = '';
          if (!results.length) {
            resultContainer.innerHTML = '';
            const msg = createElement('div', { class: 'missing-card' }, [
              createElement('p', { text: 'No matching DB items found.' }),
            ]);
            const useNameBtn = createElement('button', { type: 'button', text: 'Use bundle name as ID' });
            useNameBtn.className = 'result-button';
            useNameBtn.addEventListener('click', () => {
              // apply the szItemName (missing.name) as the ID
              missing.entry[currentIdField] = missing.name;
              missing.fixed = true;
              updateDownloadLink(jsonData, currentFileName);
              renderMissingEntries(missingEntries, items);
            });
            msg.appendChild(useNameBtn);
            resultContainer.appendChild(msg);
            return;
          }
          results.forEach(result => {
            const itemButton = createElement('button', { type: 'button', class: 'result-button', text: 'Use ID' });
            itemButton.addEventListener('click', () => {
              missing.entry[currentIdField] = result.id;
              missing.fixed = true;
              updateDownloadLink(jsonData, currentFileName);
              renderMissingEntries(missingEntries, items);
            });
            const itemInfo = createElement('div', { class: 'result-item' }, [
              createElement('span', { html: `<strong>${result.name}</strong><br>${result.id}` }),
              itemButton
            ]);
            resultContainer.appendChild(itemInfo);
          });
        }

        queryInput.addEventListener('input', updateResults);
        updateResults();

        if (missing.fixed || missing.entry[currentIdField]) {
          const status = createElement('p', { html: `<strong>Status:</strong> ID set to <code>${missing.entry[currentIdField]}</code>` });
          card.appendChild(status);
          card.style.opacity = '0.7';
        }
      });
    }

    fileInput.addEventListener('change', () => {
      jsonData = null;
      summaryEl.innerHTML = '';
      matchesEl.innerHTML = '';
      missingSection.hidden = true;
      outputEl.hidden = true;
      if (!fileInput.files || fileInput.files.length === 0) {
        processBtn.disabled = true;
        return;
      }
      processBtn.disabled = false;
    });

    processBtn.addEventListener('click', async () => {
      if (!fileInput.files || fileInput.files.length === 0) return;
      processBtn.disabled = true;
      summaryEl.innerHTML = '';
      matchesEl.innerHTML = '';
      missingList.innerHTML = '';
      missingSection.hidden = true;
      outputEl.hidden = true;

      const file = fileInput.files[0];
      const text = await file.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (err) {
        alert('Invalid JSON file.');
        processBtn.disabled = false;
        return;
      }
      if (!Array.isArray(data)) {
        alert('Expected top-level JSON array.');
        processBtn.disabled = false;
        return;
      }

      jsonData = data;
      currentIdField = document.getElementById('idField').value;

      const lookup = new Map();
      const idLookup = new Map();
      data.forEach(item => {
        const name = normalize(item.itemName || item.itemNameShort || item.szItemName || item.name || item.itemname);
        const id = item.entmName || item.EDID || item.edid || '';
        if (name && id && !lookup.has(name)) {
          lookup.set(name, id);
        }
        if (id) {
          const idKey = normalize(id);
          if (!idLookup.has(idKey)) idLookup.set(idKey, id);
        }
      });

      let updated = 0;
      const missingEntries = [];
      let bundleCount = 0;

      data.forEach(item => {
        if (!Array.isArray(item.dynamicBundleItems)) return;
        item.dynamicBundleItems.forEach(entry => {
          if (!entry || typeof entry !== 'object') return;
          if (!entry.szItemName) return;
          bundleCount += 1;
          if (entry[currentIdField]) return;
          const key = normalize(entry.szItemName);
          const id = lookup.get(key);
          if (id) {
            entry[currentIdField] = id;
            updated += 1;
          } else {
            // if the szItemName itself is actually an ID (EDID/entm style), accept that
            const idCandidate = idLookup.get(key);
            if (idCandidate) {
              entry[currentIdField] = idCandidate;
              updated += 1;
            } else {
              missingEntries.push({ entry, name: entry.szItemName, fixed: false });
            }
          }
        });
      });

      const uniqueMissing = Array.from(new Set(missingEntries.map(x => x.name)));
      summaryEl.innerHTML = `
        <div><strong>Bundle entries scanned</strong>${bundleCount}</div>
        <div><strong>IDs automatically added</strong>${updated}</div>
        <div><strong>Missing entries</strong>${uniqueMissing.length}</div>
      `;

      if (missingEntries.length > 0) {
        matchesEl.innerHTML = `
          <h2>Missing bundle names</h2>
          <p>The following names were not found in the item index and need manual resolution or database search:</p>
          <pre>${uniqueMissing.slice(0, 200).map(x => JSON.stringify(x)).join('\n')}</pre>
        `;
      }

      updateDownloadLink(data, file.name);
      currentFileName = file.name;
      renderMissingEntries(missingEntries, data);

      processBtn.disabled = false;
      outputEl.hidden = false;
      outputEl.textContent = 'JSON processed successfully. Resolve missing entries, then download the updated file if needed.';
    });
  </script>
</body>
</html>
