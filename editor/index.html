<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomic Shop Editors</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #181c1d; color: #e0e0e0; font-family: "cabin", sans-serif; }
  </style>
</head>
<body>
  <div class="tab-container">
    <button class="tab active" onclick="switchTab('bundle')">Featured Editor</button>
    <button class="tab" onclick="switchTab('daily-items')">Daily Offers Editor</button>
    <button class="tab" onclick="switchTab('daily')">Daily Free items Editor</button>
    <button class="tab" onclick="switchTab('strip')">JSON Stripper</button>
  </div>
  <div class="iframe-container">
    <iframe id="bundle" src="editor.html" class="active"></iframe>
    <iframe id="daily-items" src="daily-items-editor.html"></iframe>
    <iframe id="daily" src="daily-editor.html"></iframe>
    <iframe id="strip" src="strip.html"></iframe>
  </div>

  <script>
    function switchTab(tabId) {
      // Hide all iframes
      const iframes = document.querySelectorAll('iframe');
      iframes.forEach(iframe => iframe.classList.remove('active'));

      // Remove active class from all tabs
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(tab => tab.classList.remove('active'));

      // Show selected iframe and activate tab
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
