<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Shop DB Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 100;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        h1 {
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }

        #searchInput {
            flex: 1;
            padding: 12px 15px;
            background: #2a2a2a;
            border: 2px solid #4a9eff;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchInput:focus {
            border-color: #7bb3ff;
        }

        .stats {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .item-card {
            background: #252525;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .item-card:hover {
            border-color: #4a9eff;
            background: #2a2a2a;
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.2);
        }

        .item-image {
            width: 64px;
            height: 64px;
            background: #1a1a1a;
            border-radius: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .item-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .item-image.placeholder {
            background: #1a1a1a;
            border: 1px solid #333;
            font-size: 10px;
            color: #555;
            display: none;
        }

        .item-title {
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 6px;
            font-size: 14px;
            line-height: 1.3;
            word-break: break-word;
        }

        .item-edid {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .item-desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
            line-height: 1.4;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .item-meta {
            display: flex;
            gap: 10px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: #1a1a1a;
            padding: 4px 8px;
            border-radius: 3px;
            color: #aaa;
            border-left: 2px solid #4a9eff;
        }

        .carousel-preview {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #404040;
        }

        .carousel-thumbs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        .carousel-thumb {
            width: 64px;
            height: 64px;
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .carousel-thumb:hover {
            border-color: #4a9eff;
        }

        .carousel-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            background: #3a1a1a;
            border: 1px solid #8b3a3a;
            border-radius: 6px;
            padding: 20px;
            color: #ff6b6b;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚛️ Atomic Shop DB Viewer</h1>
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search bundles, items... (e.g., grelok, Helvetian, etc.)"
                    autocomplete="off"
                >
            </div>
            <div class="stats">
                <span id="statsText">Loading database...</span>
            </div>
        </header>

        <div id="errorContainer"></div>
        <div class="results" id="results"></div>
    </div>

    <script>
        let dbData = [];
        let displayedItems = [];
        let itemsPerPage = 50;
        let nextItemIndex = 0;
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const statsText = document.getElementById('statsText');
        const errorContainer = document.getElementById('errorContainer');

        // Load database
        async function loadDatabase() {
            try {
                const response = await fetch('data/items-db.json');
                if (!response.ok) throw new Error('Failed to load database');
                dbData = await response.json();
                statsText.textContent = `Loaded ${dbData.length} items`;
                resetAndRender(dbData);
            } catch (error) {
                errorContainer.innerHTML = `<div class="error">Error loading database: ${error.message}</div>`;
                statsText.textContent = 'Failed to load database';
            }
        }

        // Search function
        function search(query) {
            if (!query.trim()) {
                resetAndRender(dbData);
                return;
            }

            const lowerQuery = query.toLowerCase();
            const results = dbData.filter(item => {
                const edid = (item.EDID || '').toLowerCase();
                const name = (item.itemName || '').toLowerCase();
                const desc = (item.desc || '').toLowerCase();
                
                return edid.includes(lowerQuery) || name.includes(lowerQuery) || desc.includes(lowerQuery);
            });

            statsText.textContent = `Found ${results.length} of ${dbData.length} items`;
            resetAndRender(results);
        }

        // Reset and render initial batch
        function resetAndRender(items) {
            displayedItems = items;
            nextItemIndex = 0;
            resultsContainer.innerHTML = '';
            loadMoreItems();
        }

        // Load next batch of items
        function loadMoreItems() {
            if (nextItemIndex >= displayedItems.length) {
                // All items loaded
                if (nextItemIndex > 0) {
                    setupIntersectionObserver();
                }
                return;
            }

            const endIndex = Math.min(nextItemIndex + itemsPerPage, displayedItems.length);
            const itemsToAdd = displayedItems.slice(nextItemIndex, endIndex);
            
            const html = itemsToAdd.map(item => createItemCard(item)).join('');
            resultsContainer.innerHTML += html;
            
            nextItemIndex = endIndex;

            // Setup observer to load more when scrolling
            if (nextItemIndex < displayedItems.length) {
                setupIntersectionObserver();
            }
        }

        // Setup intersection observer for infinite scroll
        function setupIntersectionObserver() {
            const lastCard = resultsContainer.lastElementChild;
            if (!lastCard) return;

            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && nextItemIndex < displayedItems.length) {
                    observer.disconnect();
                    // Load next batch - reduce to 25 for subsequent loads
                    itemsPerPage = 25;
                    loadMoreItems();
                }
            }, { rootMargin: '500px' });

            observer.observe(lastCard);
        }

        // Normalize image path
        function getImagePath(directory, imageName) {
            if (!directory || !imageName) return '';
            
            let dir = directory.toLowerCase().replace(/\\/g, '/').replace(/\/+/g, '/');
            // Remove leading slash for relative path
            if (dir.startsWith('/')) { dir = dir.substring(1); }
            // Ensure directory ends with /
            if (!dir.endsWith('/')) { dir = dir + '/'; }
            
            return `${dir}${imageName}`;
        }

        // Create item card
        function createItemCard(item) {
            const hasCarousel = item.carouselImages && item.carouselImages.length > 0;
            const hasPrimaryImage = item.primaryImage && item.primaryImage.imageName;
            
            let primaryImageHtml = '<div class="item-image placeholder">No image</div>';
            
            if (hasPrimaryImage) {
                const imgPath = getImagePath(item.primaryImage.directory, item.primaryImage.imageName);
                if (imgPath) {
                    primaryImageHtml = `<div class="item-image"><img src="${imgPath}" alt="Primary" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;
                }
            }

            const carouselHtml = hasCarousel ? `
                <div class="carousel-preview">
                    <div style="font-size: 11px; color: #666; margin-bottom: 6px;">Images (${item.carouselImages.length}):</div>
                    <div class="carousel-thumbs">
                        ${item.carouselImages.map((img, idx) => {
                            const imgPath = getImagePath(img.directory, img.imageName);
                            return imgPath ? `<img class="carousel-thumb" src="${imgPath}" alt="Image ${idx + 1}" loading="lazy" onerror="this.style.display='none'" title="${img.imageName}">` : '';
                        }).join('')}
                    </div>
                </div>
            ` : '';

            const priceDisplay = item.highPriceOriginal ? `<span class="meta-tag">💰 ${item.highPriceOriginal}</span>` : 
                                 item.price ? `<span class="meta-tag">💰 ${item.price}</span>` : '';

            return `
                <div class="item-card">
                    ${primaryImageHtml}
                    <div class="item-title">${item.itemName || 'N/A'}</div>
                    <div class="item-edid">${item.EDID}</div>
                    <div class="item-desc">${item.desc || ''}</div>
                    <div class="item-meta">
                        ${hasCarousel ? `<span class="meta-tag">📸 ${item.carouselImages.length}</span>` : ''}
                        ${priceDisplay}
                    </div>
                    ${carouselHtml}
                </div>
            `;
        }

        // Event listeners
        searchInput.addEventListener('input', (e) => {
            search(e.target.value);
        });

        // Initialize
        loadDatabase();
    </script>
</body>
</html>
