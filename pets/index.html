<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fallout 76 Pet XP Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #f0f0f0; margin: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { color: #ff9900; margin-top: 0; text-align: center; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #ffcc00; }
    input[type="number"], input[type="range"] { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #121212; color: #fff; box-sizing: border-box; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; text-align: center; }
    .card { background: #2a2a2a; padding: 15px; border-radius: 8px; border-left: 4px solid #ff9900; }
    .card-val { font-size: 1.4em; font-weight: bold; color: #fff; margin-top: 5px; }
    .card-label { font-size: 0.85em; color: #aaa; }
    canvas { background: #181818; border-radius: 8px; padding: 10px; }
    .footer { text-align: center; margin-top: 20px; font-size: 0.85em; color: #777; }
    .footer span { color: #ff9900; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Fallout 76 Pet Progression Calculator</h2>
  
  <div class="controls">
    <div>
      <label for="hours">Hours Played Per Day: <span id="hours-val" style="color:#fff;">4.0</span> hrs</label>
      <input type="range" id="hours" min="0.5" max="24" step="0.5" value="4" oninput="update()">
    </div>
    <div>
      <label for="level">Target Level: <span id="level-val" style="color:#fff;">200</span></label>
      <input type="range" id="level" min="1" max="200" step="1" value="200" oninput="update()">
    </div>
  </div>

  <div class="stats">
    <div class="card"><div class="card-label">Total XP Needed</div><div class="card-val" id="total-xp">0</div></div>
    <div class="card"><div class="card-label">Daily XP Yield</div><div class="card-val" id="daily-xp">0</div></div>
    <div class="card"><div class="card-label">Calendar Days</div><div class="card-val" id="days-needed">0</div></div>
    <div class="card"><div class="card-label">Total In-Game Hours</div><div class="card-val" id="hours-needed">0</div></div>
  </div>

  <canvas id="xpChart" height="120"></canvas>

  <div class="footer">Made with <span>Gemini</span></div>
</div>

<script>
  let chart;

  function calcLevelXP(lvl) {
    return 420 * lvl + (25 * lvl * (lvl - 1)) / 2;
  }

  function getDailyXP(hrs) {
    if (hrs <= 4) {
      return hrs * 3000;
    } else {
      return 12000 + (hrs - 4) * 300;
    }
  }

  function initChart() {
    const ctx = document.getElementById('xpChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Days Required to Level',
          data: [],
          borderColor: '#ff9900',
          backgroundColor: 'rgba(255, 153, 0, 0.1)',
          fill: true,
          tension: 0.2,
          pointRadius: 0,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#ccc' } } },
        scales: {
          x: { title: { display: true, text: 'Pet Level', color: '#aaa' }, ticks: { color: '#888' }, grid: { color: '#222' } },
          y: { title: { display: true, text: 'Calendar Days Required', color: '#aaa' }, ticks: { color: '#888' }, grid: { color: '#222' } }
        }
      }
    });
  }

  function update() {
    const hrs = parseFloat(document.getElementById('hours').value);
    const targetLvl = parseInt(document.getElementById('level').value);

    document.getElementById('hours-val').innerText = hrs.toFixed(1);
    document.getElementById('level-val').innerText = targetLvl;

    const totalXP = calcLevelXP(targetLvl);
    const dailyXP = getDailyXP(hrs);
    const daysNeeded = totalXP / dailyXP;
    const activeHours = daysNeeded * hrs;

    document.getElementById('total-xp').innerText = totalXP.toLocaleString() + ' XP';
    document.getElementById('daily-xp').innerText = dailyXP.toLocaleString() + ' XP/d';
    document.getElementById('days-needed').innerText = daysNeeded.toFixed(1) + ' Days';
    document.getElementById('hours-needed').innerText = activeHours.toFixed(1) + ' Hrs';

    const labels = [];
    const dataPoints = [];

    for (let l = 1; l <= targetLvl; l++) {
      labels.push('Lvl ' + l);
      dataPoints.push((calcLevelXP(l) / dailyXP).toFixed(2));
    }

    chart.data.labels = labels;
    chart.data.datasets[0].data = dataPoints;
    chart.update();
  }

  window.onload = function() {
    initChart();
    update();
  };
</script>

</body>
</html>
