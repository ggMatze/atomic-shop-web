<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broken Image Checker</title>
<style>
body {
    font-family: Arial;
    background: #111;
    color: #eee;
    padding: 20px;
}

button {
    padding: 10px 14px;
    margin-bottom: 15px;
    cursor: pointer;
}

.item {
    padding: 6px;
    border-bottom: 1px solid #333;
}

.bad {
    color: #ff4d4d;
}

small {
    color: #888;
}
</style>
</head>
<body>

<h2>❌ Broken Image Checker</h2>

<button onclick="runCheck()">Scan DB</button>

<div id="out"></div>

<script>
let db = [];

function getImagePath(directory, imageName) {
    if (!directory || !imageName) return null;

    let dir = directory.toLowerCase().replace(/\\/g, '/');

    if (dir.startsWith('/')) dir = dir.slice(1);
    if (!dir.endsWith('/')) dir += '/';

    return "../" + dir + imageName;
}

function checkImageExists(url) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
    });
}

async function runCheck() {
    const out = document.getElementById("out");
    out.innerHTML = "Loading DB...";

    let text;

    // ✅ Load DB safely
    try {
        const res = await fetch("../data/items-db.json");
        console.log("Fetch status:", res.status);

        text = await res.text();
        text = text.replace(/^\uFEFF/, '');

        db = JSON.parse(text);

        console.log("DB loaded, items:", db.length);

    } catch (e) {
        console.error("JSON ERROR:", e);
        out.innerHTML = "❌ Failed to load DB (check console)";
        return;
    }

    if (!Array.isArray(db)) {
        console.error("DB is not array:", db);
        out.innerHTML = "❌ DB format invalid";
        return;
    }

    out.innerHTML = "Scanning...";

    // ✅ SAFE CHUNKED SCAN (NO FREEZE)
    const broken = [];
    const batchSize = 100;

    for (let i = 0; i < db.length; i += batchSize) {
        const batch = db.slice(i, i + batchSize);

        const results = await Promise.all(batch.map(async (item) => {
            const img = item.primaryImage;
            if (!img) return null;

            const path = getImagePath(img.directory, img.imageName);
            if (!path) return null;

            const exists = await checkImageExists(path);

            if (!exists) {
                return {
                    edid: item.EDID || "no-edid",
                    path
                };
            }

            return null;
        }));

        results.forEach(r => {
            if (r) broken.push(r);
        });

        out.innerHTML = `Scanning... ${Math.min(i + batchSize, db.length)} / ${db.length}`;
    }

    // ✅ RESULT OUTPUT
    if (broken.length === 0) {
        out.innerHTML = "✔ No broken images found.";
        return;
    }

    out.innerHTML = `<b>Broken images: ${broken.length}</b><br><br>`;

    broken.forEach(item => {
        const div = document.createElement("div");
        div.className = "item bad";

        div.innerHTML = `
            ❌ ${item.edid}<br>
            <small>${item.path}</small>
        `;

        out.appendChild(div);
    });
}
</script>

</body>
</html>
