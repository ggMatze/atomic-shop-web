<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Shop DB Viewer</title>
    <link rel="icon" type="image/svg+xml" href="../media/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Full-page video background -->
    <video class="page-background-video" autoplay muted loop>
        <source src="../media/AtomicShop.webm" type="video/webm">
    </video>

    <div class="container">
        <header>
            <h1>⚛ Atomic Shop DB Viewer</h1>
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search, ID or Item Name..."
                    autocomplete="on"
                >
            </div>
            <div class="stats">
                <span id="statsText">Loading database...</span>
            </div>
        </header>

        <div id="errorContainer"></div>
        <div class="results" id="results"></div>
    </div>

    <!-- Overlay for item details (matching main page structure) -->
    <div id="item-overlay" class="item-overlay hidden">
        <div class="overlay-content">
            <button class="overlay-close">&times;</button>

            <div class="overlay-disclaimer" id="overlay-disclaimer"></div>

            <h2 class="overlay-title">Item Title</h2>
            
            <!-- DB Info Panel (ABSOLUTE OVERLAY) -->
            <div id="overlay-db-info" class="overlay-db-info">
                <div class="db-info-header">- DATABASE INFO -</div>
                <div id="db-info-content"></div>
            </div>
            
            <div style="display: flex; gap: 20px; width: 100%; max-width: 1000px; margin: 20px auto;">
                <!-- Gallery (CENTER/RIGHT) -->
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
                    <div class="gallery-wrapper">
                        <img id="main-image" class="center-image" src="" alt="Main Image">
                        <div class="strip-container left-strip-container">
                            <div class="strip" id="left-strip"></div>
                        </div>
                        <div class="strip-container right-strip-container">
                            <div class="strip" id="right-strip"></div>
                        </div>
                    </div>

                    <p class="overlay-description">.</p>
                </div>
            </div>

            <button class="overlay-button">Tab) CLOSE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
