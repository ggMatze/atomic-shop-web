<!DOCTYPE html>
<html lang="en">
<script>
(function(){
    const host = window.location.hostname;
    const path = window.location.pathname;

    // local development should not be redirected
    if (host === "localhost" || host === "127.0.0.1") {
        return;
    }

    // 1. pages.dev → neue Subdomain
    if (host.includes("pages.dev")) {
        window.location.replace("https://db.atomicshop.fyi" + path.replace("/db-viewer", "") + window.location.search);
    }

    // 2. alte Subdomain uf.atomicshop.fyi → neue Subdomain
    if (host === "uf.atomicshop.fyi") {
        window.location.replace("https://db.atomicshop.fyi" + path.replace("/db-viewer", "") + window.location.search);
    }

    // 3. Falls jemand direkt /db-viewer/ aufruft → auf Root der neuen Subdomain
    if (path.startsWith("/db-viewer")) {
        window.location.replace("https://db.atomicshop.fyi/");
    }
})();
</script>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Shop DB Browser</title>
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
    <link rel="stylesheet" href="/db-viewer/styles.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Full-page video background -->
    <video class="page-background-video" autoplay muted loop>
        <source src="/media/AtomicShop.webm" type="video/webm">
    </video>
    <button id="scrollTopBtn" onclick="scrollToTop()">&nbsp;</button>
    <div class="container">
        <header>
            <h1>⚛ Atomic Shop DB Browser</h1>
            
            <div class="search-box">
                
                <button id="go-ufas" title="Browse user-friendly atomic shop">&nbsp;</button>
                <!-- <span id="ufas-label" >View Atomic Shop</span>-->
                <div class="search-input-wrapper">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="&#x1F50E;&#xFE0E;	Ctrl + F"
                        autocomplete="on"
                    >
                    <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">✕</button>
                </div>
                <button id="filter-toggle">Filters ▼</button>
            </div>
            <div id="filter-panel" class="filter-panel hidden">
                <!-- Checkboxes will be populated here -->
            </div>
            
            <div class="stats">
                <span id="age"></span>

<span id="age"></span><br>

       <span id="age"></span>

            <script>
            fetch("https://api.github.com/repos/ggMatze/atomic-shop-web/commits?path=data/items-db.json&per_page=1")
            .then(res => res.json())
            .then(data => {
                const lastCommitDate = new Date(data[0].commit.committer.date);
                const now = new Date();

                const diffMs = now - lastCommitDate;

                const minutes = Math.floor(diffMs / (1000 * 60));
                const hours = Math.floor(diffMs / (1000 * 60 * 60));
                const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));

                let text;

                if (minutes < 1) {
                text = "just now, probably still processing... (F5 to refresh)";
                } else if (minutes < 60) {
                text = minutes + " minute" + (minutes === 1 ? "" : "s") + " ago";
                } else if (hours < 24) {
                text = hours + " hour" + (hours === 1 ? "" : "s") + " ago";
                } else {
                text = days + " day" + (days === 1 ? "" : "s") + " ago";
                }

                document.getElementById("age").textContent = "Updated " + text;
            })
            .catch(() => {
                document.getElementById("age").textContent = "Could not load update time";
            });
            </script>
                <span id="statsText">Loading database...</span>
            </div>
        </header>
        
        <div id="errorContainer"></div>
        <div class="results" id="results"></div>
    </div>

    <!-- Overlay for item details (matching main page structure) -->
    <div id="item-overlay" class="item-overlay hidden">
        <div class="overlay-content">
            <button class="overlay-close">&times;</button>

            <div class="overlay-disclaimer" id="overlay-disclaimer"></div>

            <div id="overlay-keyword-tags" class="overlay-keyword-tags" aria-live="polite"></div>
            <h2 class="overlay-title">Item Title</h2>
            <span id="overlay-link-btn" class="link-btn" title="Share this item">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffd454" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="M8.59 13.51l6.83 3.98"/>
                    <path d="M15.41 6.51L8.59 10.49"/>
                </svg>
            </span>
            <input id="overlay-link-box" class="link-box" type="text" readonly style="display:none;" title="Press Ctrl+C to copy the link">
            
            <!-- DB Info Panel (ABSOLUTE OVERLAY) -->
            <div id="overlay-db-info" class="overlay-db-info">
                <div class="db-info-header">- DATABASE INFO -</div>
                <div id="db-info-content"></div>
            </div>
            
            <div style="display: flex; gap: 20px; width: 100%; max-width: 1000px; margin: 20px auto;">
                <!-- Gallery (CENTER/RIGHT) -->
                <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
                    <div class="gallery-wrapper">
                        <img id="main-image" class="center-image" src="" alt="Main Image">
                        <div class="strip-container left-strip-container">
                            <div class="strip" id="left-strip"></div>
                        </div>
                        <div class="strip-container right-strip-container">
                            <div class="strip" id="right-strip"></div>
                        </div>
                    </div>

                    <p class="overlay-description">.</p>
                </div>
            </div>

            <button class="overlay-button" id="overlay-close-text-btn">Tab) CLOSE</button>
        </div>
    </div>

    <script src="owned-db.js"></script>
    <script src="script.js"></script>
</body>
</html>
