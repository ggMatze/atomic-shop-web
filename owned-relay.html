<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Owned Items Relay</title>
    <style>
        body { margin: 0; padding: 0; display: none; }
    </style>
</head>
<body>
<script>
(function() {
  const RELAY_STORAGE_IDS = 'atomicShopOwnedIds';
  const RELAY_STORAGE_FAVORITES = 'atomicShopFavoriteIds';
  
  // Track parent window
  let parentWindow = window.parent;
  let parentOrigin = '*';
  
  function readData(key) {
    try {
      return localStorage.getItem(key) || '';
    } catch (e) {
      console.error('[relay] localStorage read failed', e);
      return '';
    }
  }
  
  function writeData(key, value) {
    try {
      localStorage.setItem(key, value);
      console.log('[relay] Stored', key, 'length:', value.length);
    } catch (e) {
      console.error('[relay] localStorage write failed', e);
    }
  }
  
  // Listen for messages from parent window
  window.addEventListener('message', (event) => {
    const data = event.data;
    
    if (!data || typeof data !== 'object') return;
    
    console.log('[relay] Received message:', data.type);
    
    // Register parent window
    if (data.type === 'RELAY_REGISTER') {
      parentWindow = event.source;
      parentOrigin = event.origin;
      console.log('[relay] Parent window registered from', event.origin);
      
      // Send current data to parent
      parentWindow.postMessage({
        type: 'RELAY_DATA',
        ownedIds: readData(RELAY_STORAGE_IDS),
        favoriteIds: readData(RELAY_STORAGE_FAVORITES)
      }, parentOrigin);
      return;
    }
    
    // Update owned IDs
    if (data.type === 'RELAY_UPDATE_OWNED') {
      if (typeof data.ownedIds === 'string') {
        writeData(RELAY_STORAGE_IDS, data.ownedIds);
      }
      return;
    }
    
    // Update favorite IDs
    if (data.type === 'RELAY_UPDATE_FAVORITES') {
      if (typeof data.favoriteIds === 'string') {
        writeData(RELAY_STORAGE_FAVORITES, data.favoriteIds);
      }
      return;
    }
    
    // Get current data
    if (data.type === 'RELAY_GET_DATA') {
      parentWindow.postMessage({
        type: 'RELAY_DATA',
        ownedIds: readData(RELAY_STORAGE_IDS),
        favoriteIds: readData(RELAY_STORAGE_FAVORITES)
      }, parentOrigin);
      return;
    }
  });
  
  // Listen for localStorage changes from other relay instances (other tabs/windows on atomicshop.fyi)
  window.addEventListener('storage', (event) => {
    if (event.key === RELAY_STORAGE_IDS || event.key === RELAY_STORAGE_FAVORITES) {
      console.log('[relay] Storage event detected for', event.key, 'new length:', event.newValue ? event.newValue.length : 0);
      
      // Notify parent window of the change
      if (parentWindow && parentWindow !== window.parent) {
        parentWindow.postMessage({
          type: 'RELAY_DATA',
          ownedIds: readData(RELAY_STORAGE_IDS),
          favoriteIds: readData(RELAY_STORAGE_FAVORITES)
        }, parentOrigin);
      } else {
        // If parent not yet registered, send to current parent anyway
        window.parent.postMessage({
          type: 'RELAY_DATA',
          ownedIds: readData(RELAY_STORAGE_IDS),
          favoriteIds: readData(RELAY_STORAGE_FAVORITES)
        }, '*');
      }
    }
  });
  
  console.log('[relay] Owned Items Relay initialized');
})();
</script>
</body>
</html>
