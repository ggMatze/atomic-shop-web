<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Owned Items Relay</title>
    <style>
        body { margin: 0; padding: 0; display: none; }
    </style>
</head>
<body>
<script>
(function() {
  const RELAY_STORAGE_IDS = 'atomicShopOwnedIds';
  const RELAY_STORAGE_FAVORITES = 'atomicShopFavoriteIds';
  
  // Track all connected parent windows
  const connectedParents = new Map(); // { origin: window }
  
  function readData(key) {
    try {
      return localStorage.getItem(key) || '';
    } catch (e) {
      console.error('[relay] localStorage read failed', e);
      return '';
    }
  }
  
  function writeData(key, value) {
    try {
      localStorage.setItem(key, value);
      console.log('[relay] Stored', key, 'length:', value.length);
    } catch (e) {
      console.error('[relay] localStorage write failed', e);
    }
  }
  
  function broadcastToAllParents(message) {
    connectedParents.forEach((parentWindow, origin) => {
      try {
        parentWindow.postMessage(message, origin);
      } catch (e) {
        console.error('[relay] Broadcast to', origin, 'failed', e);
        connectedParents.delete(origin);
      }
    });
  }
  
  // Listen for messages from parent windows
  window.addEventListener('message', (event) => {
    const data = event.data;
    
    if (!data || typeof data !== 'object') return;
    
    console.log('[relay] Received message:', data.type, 'from', event.origin);
    
    // Register parent window
    if (data.type === 'RELAY_REGISTER') {
      connectedParents.set(event.origin, event.source);
      console.log('[relay] Parent window registered from', event.origin, '. Total parents:', connectedParents.size);
      
      // Send current data to registering parent
      event.source.postMessage({
        type: 'RELAY_DATA',
        ownedIds: readData(RELAY_STORAGE_IDS),
        favoriteIds: readData(RELAY_STORAGE_FAVORITES)
      }, event.origin);
      return;
    }
    
    // Update owned IDs
    if (data.type === 'RELAY_UPDATE_OWNED') {
      if (typeof data.ownedIds === 'string') {
        writeData(RELAY_STORAGE_IDS, data.ownedIds);
        // Broadcast updated data to all other parents
        broadcastToAllParents({
          type: 'RELAY_DATA',
          ownedIds: data.ownedIds,
          favoriteIds: readData(RELAY_STORAGE_FAVORITES)
        });
      }
      return;
    }
    
    // Clear owned IDs
    if (data.type === 'RELAY_CLEAR_OWNED') {
      try {
        localStorage.removeItem(RELAY_STORAGE_IDS);
        console.log('[relay] Cleared owned IDs');
        // Broadcast cleared data to all parents
        broadcastToAllParents({
          type: 'RELAY_DATA',
          ownedIds: '',
          favoriteIds: readData(RELAY_STORAGE_FAVORITES)
        });
      } catch (e) {
        console.error('[relay] localStorage clear failed', e);
      }
      return;
    }
    
    // Update favorite IDs
    if (data.type === 'RELAY_UPDATE_FAVORITES') {
      if (typeof data.favoriteIds === 'string') {
        writeData(RELAY_STORAGE_FAVORITES, data.favoriteIds);
        // Broadcast updated data to all other parents
        broadcastToAllParents({
          type: 'RELAY_DATA',
          ownedIds: readData(RELAY_STORAGE_IDS),
          favoriteIds: data.favoriteIds
        });
      }
      return;
    }
    
    // Clear favorite IDs
    if (data.type === 'RELAY_CLEAR_FAVORITES') {
      try {
        localStorage.removeItem(RELAY_STORAGE_FAVORITES);
        console.log('[relay] Cleared favorite IDs');
        // Broadcast cleared data to all parents
        broadcastToAllParents({
          type: 'RELAY_DATA',
          ownedIds: readData(RELAY_STORAGE_IDS),
          favoriteIds: ''
        });
      } catch (e) {
        console.error('[relay] localStorage clear failed', e);
      }
      return;
    }
    
    // Get current data
    if (data.type === 'RELAY_GET_DATA') {
      event.source.postMessage({
        type: 'RELAY_DATA',
        ownedIds: readData(RELAY_STORAGE_IDS),
        favoriteIds: readData(RELAY_STORAGE_FAVORITES)
      }, event.origin);
      return;
    }
  });
  
  // Listen for localStorage changes from storage events (when other relay iframes on same origin update storage)
  window.addEventListener('storage', (event) => {
    if (event.key === RELAY_STORAGE_IDS || event.key === RELAY_STORAGE_FAVORITES) {
      console.log('[relay] Storage event detected for', event.key, 'new length:', event.newValue ? event.newValue.length : 0);
      
      // Notify all connected parents about the storage change
      broadcastToAllParents({
        type: 'RELAY_DATA',
        ownedIds: readData(RELAY_STORAGE_IDS),
        favoriteIds: readData(RELAY_STORAGE_FAVORITES)
      });
    }
  });
  
  console.log('[relay] Owned Items Relay initialized');
})();
</script>
</body>
</html>
